/* ---------- 定数 ---------- */
const HINT_LEVELS = [
  null,
  { lv:1, label:'超接写',   points:10, floor:7 },
  { lv:2, label:'接写',     points:7,  floor:5 },
  { lv:3, label:'全体像',   points:5,  floor:3 },
  { lv:4, label:'周辺環境', points:3,  floor:1 },
  { lv:5, label:'広域風景', points:1,  floor:0 }
];
const COOLDOWN_MS = 4000;
const DEFAULT_TIME_LIMIT_MIN = 20;
const DEFAULT_RADIUS_M = 25;
const MIN_RADIUS_M = 5;
const MAX_RADIUS_M = 200;
const IMG_MAX_WIDTH = 720;
const IMG_QUALITY = 0.72;
const LS_KEY_PROJECT_ID = 'tc_fb_project_id';
const DB_NAME = 'target_capture_db';
const DB_VERSION = 1;

/* ---------- 小ユーティリティ ---------- */
function uid(prefix){ return (prefix||'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function clamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }
function escHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function distMeters(lat1, lng1, lat2, lng2){
  if (lat1==null || lng1==null || lat2==null || lng2==null) return Infinity;
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2-lat1);
  const dLng = toRad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R*c;
}
let toastTimer = null;
function toast(msg, kind){
  const el = document.getElementById('toast');
  const color = kind==='error' ? 'bg-terracotta text-white' : (kind==='ok' ? 'bg-sage text-white' : 'bg-stone-800 text-white');
  el.innerHTML = `<div class="${color} rounded-xl shadow-lg px-4 py-3 text-sm font-medium text-center">${escHtml(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.innerHTML=''; }, 3200);
}

/* ---------- IndexedDB Promiseラッパー ---------- */
function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('gmRoom')) db.createObjectStore('gmRoom', { keyPath:'id' });
      if (!db.objectStoreNames.contains('playerSession')) db.createObjectStore('playerSession', { keyPath:'id' });
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}
async function idbPut(store, value){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(value);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e.target.error);
  });
}
async function idbGet(store, id){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e.target.error);
  });
}
async function idbDelete(store, id){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e.target.error);
  });
}

/* ---------- Firebase Realtime Database REST (SDK不使用) ---------- */
function randomRoomCode(){
  return String(Math.floor(1000 + Math.random()*9000));
}
async function createRoomWithRetry(projectId, roomData, maxAttempts){
  maxAttempts = maxAttempts || 3;
  let lastErr = null;
  for (let i=0; i<maxAttempts; i++){
    const code = randomRoomCode();
    const url = `https://${projectId}.firebaseio.com/rooms/${code}.json`;
    try {
      const res = await fetch(url, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(roomData)
      });
      if (res.ok) return code;
      lastErr = new Error('HTTP ' + res.status);
    } catch(e){
      lastErr = e;
    }
  }
  throw lastErr || new Error('部屋の作成に失敗しました');
}
async function fetchRoom(projectId, roomCode){
  const url = `https://${projectId}.firebaseio.com/rooms/${roomCode}.json`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('通信エラー (HTTP ' + res.status + ')');
  const data = await res.json();
  if (!data) throw new Error('お題データが見つかりません。暗号をご確認ください。');
  return data;
}

/* ---------- 画像自動圧縮 (Canvas API) ---------- */
function compressImageFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > IMG_MAX_WIDTH){
          h = Math.round(h * IMG_MAX_WIDTH / w);
          w = IMG_MAX_WIDTH;
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', IMG_QUALITY));
      };
      img.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('ファイルの読み込みに失敗しました'));
    reader.readAsDataURL(file);
  });
}

/* ---------- OpenLocationCode (Plus Code) 連携 ---------- */
let olcInstance = null;
(function initOlc(){
  try {
    const ns = window.OpenLocationCode;
    const Ctor = ns && (ns.OpenLocationCode || (typeof ns === 'function' ? ns : null));
    if (typeof Ctor === 'function'){
      const inst = new Ctor();
      const testCode = inst.encode(35.681236, 139.767125, 10);
      const testDecoded = inst.decode(testCode);
      if (testDecoded && typeof testDecoded.latitudeCenter === 'number') olcInstance = inst;
    }
  } catch(e){ olcInstance = null; }
})();
function olcEncodeSafe(lat, lng){
  if (!olcInstance || lat==null || lng==null) return '';
  try { return olcInstance.encode(lat, lng, 10); } catch(e){ return ''; }
}
function olcDecodeSafe(code, refLat, refLng){
  if (!olcInstance || !code) return null;
  try {
    let full = code.trim().toUpperCase();
    if (olcInstance.isFull(full)){
      const d = olcInstance.decode(full);
      return { lat: d.latitudeCenter, lng: d.longitudeCenter };
    }
    if (olcInstance.isShort(full) && refLat!=null && refLng!=null){
      full = olcInstance.recoverNearest(full, refLat, refLng);
      const d = olcInstance.decode(full);
      return { lat: d.latitudeCenter, lng: d.longitudeCenter };
    }
    return null;
  } catch(e){ return null; }
}

/* ---------- Leaflet 地図ライフサイクル管理 ---------- */
window.__activeMaps = window.__activeMaps || {};
function cleanupTargetMaps(){
  Object.keys(window.__activeMaps).forEach(k => {
    try { window.__activeMaps[k].remove(); } catch(e){}
  });
  window.__activeMaps = {};
}
function initTargetMap(targetId){
  const el = document.getElementById('map_' + targetId);
  if (!el || typeof L === 'undefined') return;
  const t = findDraftTarget(targetId);
  if (!t) return;
  const hasPos = t.lat != null && t.lng != null;
  const lat = hasPos ? t.lat : 35.3084;
  const lng = hasPos ? t.lng : 139.8628; // 富津市付近を初期表示
  const map = L.map(el, { attributionControl:false, zoomControl:true }).setView([lat, lng], hasPos ? 17 : 13);
  L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '地理院タイル'
  }).addTo(map);
  const marker = L.marker([lat, lng], { draggable:true }).addTo(map);
  marker.on('dragend', () => {
    const p = marker.getLatLng();
    setDraftTargetLatLng(targetId, p.lat, p.lng, true);
  });
  map.on('click', (e) => {
    marker.setLatLng(e.latlng);
    setDraftTargetLatLng(targetId, e.latlng.lat, e.latlng.lng, true);
  });
  window.__activeMaps[targetId] = map;
  window.__activeMaps[targetId + '_marker'] = marker;
  setTimeout(() => { try { map.invalidateSize(); } catch(e){} }, 100);
}
function initAllTargetMaps(){
  cleanupTargetMaps();
  const targets = AppState.gmDraft.targets;
  targets.forEach(t => initTargetMap(t.id));
}

/* ---------- アプリ状態 ---------- */
const AppState = {
  screen: 'title',
  loading: false,
  resumeAvailable: false,
  resumeSession: null,
  urlRoomCode: '',
  urlProjectId: '',
  gmDraft: {
    projectId: localStorage.getItem(LS_KEY_PROJECT_ID) || '',
    timeLimitMin: DEFAULT_TIME_LIMIT_MIN,
    defaultRadius: DEFAULT_RADIUS_M,
    targets: []
  },
  gmCreatedCode: '',
  playerJoin: {
    projectId: '',
    code: ''
  },
  session: null,          // { roomCode, timeLimitSec, defaultRadius, targets:[...], remainingSec, totalScore, targetStates:{}, selectedTargetId, startedAt }
  cooldownUntil: 0,
  currentPosition: null,
  gpsWatchId: null,
  timerHandle: null,
  saveHandle: null,
  lastResult: null
};

function findDraftTarget(id){
  return AppState.gmDraft.targets.find(t => t.id === id);
}

/* ---------- ルーティング / レンダリング ---------- */
function setScreen(screen){
  AppState.screen = screen;
  render();
}
function render(){
  const app = document.getElementById('app');
  let html = '';
  switch(AppState.screen){
    case 'title': html = renderTitle(); break;
    case 'gmSetup': html = renderGmSetup(); break;
    case 'gmCreated': html = renderGmCreated(); break;
    case 'playerJoin': html = renderPlayerJoin(); break;
    case 'explore': html = renderExplore(); break;
    case 'result': html = renderResult(); break;
    default: html = renderTitle();
  }
  app.innerHTML = html;
  afterRender();
}
function afterRender(){
  if (AppState.screen === 'gmSetup'){
    initAllTargetMaps();
  } else {
    cleanupTargetMaps();
  }
  if (AppState.screen === 'gmCreated'){
    drawRoomQr();
  }
}

      <button onclick="goPlayerJoin()" class="w-full bg-sage text-white rounded-2xl p-5 text-left shadow-sm active:bg-sage-dark">

}
function goGmSetup(){

}
function goPlayerJoin(){
  AppState.playerJoin.projectId = AppState.urlProjectId || localStorage.getItem(LS_KEY_PROJECT_ID) || '';
  AppState.playerJoin.code = AppState.urlRoomCode || '';
  setScreen('playerJoin');
}
async function checkResumeOnLoad(){
  try {
    const s = await idbGet('playerSession', 'current');
    if (s && s.remainingSec > 0 && s.roomCode){
      AppState.resumeAvailable = true;
      AppState.resumeSession = s;
    }
  } catch(e){}
}
function resumeSession(){
  AppState.session = AppState.resumeSession;
  AppState.resumeAvailable = false;
  startExploreRuntime();
}
async function discardResume(){
  AppState.resumeAvailable = false;
  AppState.resumeSession = null;
  try { await idbDelete('playerSession', 'current'); } catch(e){}
  render();
}

function renderTargetCard(t, idx){
  const hintsHtml = HINT_LEVELS.slice(1).map(h => {
    const photo = t.hints[h.lv];
    return `
    <div class="flex-shrink-0 w-24">
      <div class="text-[10px] font-bold text-stone-500 mb-1">Lv${h.lv} ${h.label}（${h.points}pt）</div>

        <input type="file" accept="image/*" capture="environment" class="hidden" onchange="onHintPhotoChange(event,'${t.id}',${h.lv})">
      </label>
      ${photo ? `<button onclick="clearHintPhoto('${t.id}',${h.lv})" class="text-[10px] text-terracotta mt-1">削除</button>` : ''}
    </div>`;

  return `
  <div class="bg-white border border-stone-300 rounded-2xl p-4 shadow-sm" data-target-card="${t.id}">
    <div class="flex items-center gap-2 mb-3">
      <span class="text-xs font-bold text-stone-400">#${idx+1}</span>

        class="flex-1 border-b border-stone-300 px-1 py-1 text-sm font-bold focus:outline-none focus:border-sage">
      <button onclick="removeTarget('${t.id}')" class="text-terracotta text-sm">削除</button>
    </div>

    <div class="flex gap-3 overflow-x-auto tc-scrollbar-none pb-2 mb-3">${hintsHtml}</div>

    <div id="map_${t.id}" class="w-full rounded-xl border border-stone-300 mb-3" style="height:192px;"></div>

    <div class="grid grid-cols-2 gap-2 mb-2">
      <div>
        <label class="text-[11px] font-bold text-stone-500">緯度</label>
        <input type="number" step="0.000001" value="${t.lat!=null?t.lat:''}" oninput="onLatLngInput('${t.id}','lat',this.value)"
          class="w-full border border-stone-300 rounded-lg px-2 py-1.5 text-sm">
      </div>
      <div>
        <label class="text-[11px] font-bold text-stone-500">経度</label>
        <input type="number" step="0.000001" value="${t.lng!=null?t.lng:''}" oninput="onLatLngInput('${t.id}','lng',this.value)"

      </div>
    </div>

        <input id="pluscode_${t.id}" type="text" value="${escHtml(t.plusCode||'')}" ${olcInstance?'':'disabled'} placeholder="例: 8Q7XMPCJ+2V"
          oninput="updateTargetField('${t.id}','plusCode',this.value)"
          class="flex-1 border border-stone-300 rounded-lg px-2 py-1.5 text-sm disabled:bg-stone-100">
        <button onclick="applyPlusCode('${t.id}')" ${olcInstance?'':'disabled'} class="bg-stone-800 text-white text-xs font-bold rounded-lg px-3 disabled:opacity-40">反映</button>
      </div>
    </div>

    <div class="flex items-center gap-2 mb-2">
      <button onclick="setTargetToCurrentLocation('${t.id}')" class="bg-stone-800 text-white text-xs font-bold rounded-lg px-3 py-2">📍 現在地をセット</button>
      <span id="poslabel_${t.id}" class="text-[11px] text-stone-500 flex-1">${posLabel}</span>
    </div>

function goTitle(){

function updateGmField(key, val){

    AppState.gmDraft[key] = val === '' ? '' : Number(val);
  } else {
    AppState.gmDraft[key] = val;

  }

function addTarget(){

function removeTarget(id){

}
function updateTargetField(id, field, val){
  const t = findDraftTarget(id);

  if (field === 'radius'){

async function onHintPhotoChange(evt, targetId, lv){

}
function clearHintPhoto(targetId, lv){

  if (!t) return;

function setDraftTargetLatLng(targetId, lat, lng, fromMap){
  const t = findDraftTarget(targetId);
  if (!t) return;
  t.lat = lat; t.lng = lng;
  t.plusCode = olcEncodeSafe(lat, lng) || t.plusCode;
  // 地図操作由来の場合はフル再レンダーせず該当フィールドのみ直接更新（地図の再初期化ループを防止）
  const latInput = document.querySelector(`[data-target-card="${targetId}"] input[oninput^="onLatLngInput('${targetId}','lat'"]`);
  const lngInput = document.querySelector(`[data-target-card="${targetId}"] input[oninput^="onLatLngInput('${targetId}','lng'"]`);
  const posSpan = document.getElementById('poslabel_' + targetId);
  const pcInput = document.getElementById('pluscode_' + targetId);
  if (latInput) latInput.value = lat.toFixed(6);
  if (lngInput) lngInput.value = lng.toFixed(6);
  if (posSpan) posSpan.textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
  if (pcInput) pcInput.value = t.plusCode;
}
function onLatLngInput(targetId, field, val){
  const t = findDraftTarget(targetId);
  if (!t) return;
  const num = val === '' ? null : Number(val);
  t[field] = num;
  if (t.lat!=null && t.lng!=null){
    t.plusCode = olcEncodeSafe(t.lat, t.lng) || t.plusCode;
    const pcInput = document.getElementById('pluscode_' + targetId);
    if (pcInput) pcInput.value = t.plusCode;
    const map = window.__activeMaps[targetId];
    const marker = window.__activeMaps[targetId + '_marker'];
    if (map && marker){
      marker.setLatLng([t.lat, t.lng]);
      map.panTo([t.lat, t.lng]);
    }
  }
}
function applyPlusCode(targetId){
  const t = findDraftTarget(targetId);
  if (!t) return;
  const input = document.getElementById('pluscode_' + targetId);
  const code = input ? input.value : t.plusCode;
  const refLat = t.lat != null ? t.lat : 35.3084;
  const refLng = t.lng != null ? t.lng : 139.8628;
  const result = olcDecodeSafe(code, refLat, refLng);
  if (!result){
    toast('Plus Codeを読み取れませんでした。完全なコードを入力するか、地図で指定してください。', 'error');
    return;
  }
  setDraftTargetLatLng(targetId, result.lat, result.lng, false);
  const map = window.__activeMaps[targetId];
  if (map) map.setView([result.lat, result.lng], 17);
  toast('位置を更新しました', 'ok');
}
function setTargetToCurrentLocation(targetId){
  if (!navigator.geolocation){
    toast('この端末は位置情報に対応していません', 'error');
    return;
  }
  toast('現在地を取得中…');
  navigator.geolocation.getCurrentPosition((pos) => {
    setDraftTargetLatLng(targetId, pos.coords.latitude, pos.coords.longitude, false);
    const map = window.__activeMaps[targetId];
    if (map) map.setView([pos.coords.latitude, pos.coords.longitude], 17);
    toast('現在地をセットしました', 'ok');
  }, (err) => {
    toast('現在地の取得に失敗しました: ' + err.message, 'error');
  }, { enableHighAccuracy:true, timeout:10000 });
}

async function createRoom(){
  const d = AppState.gmDraft;
  if (!d.projectId){ toast('Firebase Project ID を入力してください', 'error'); return; }
  if (d.targets.length === 0){ toast('お題を1件以上追加してください', 'error'); return; }
  for (const t of d.targets){
    if (!t.name){ toast('すべてのお題に名前を入力してください', 'error'); return; }
    if (t.lat==null || t.lng==null){ toast(`「${t.name || '無題'}」の位置が未設定です`, 'error'); return; }
    if (!t.hints[1]){ toast(`「${t.name}」のLv1ヒント写真は必須です`, 'error'); return; }
  }
  AppState.loading = true; render();
  try {
    const roomData = {
      timeLimitSec: Math.max(60, Math.round((Number(d.timeLimitMin)||DEFAULT_TIME_LIMIT_MIN) * 60)),
      defaultRadius: clamp(Number(d.defaultRadius)||DEFAULT_RADIUS_M, MIN_RADIUS_M, MAX_RADIUS_M),
      createdAt: Date.now(),
      targets: d.targets.map(t => ({
        id: t.id, name: t.name,
        hints: t.hints,
        lat: t.lat, lng: t.lng,
        radius: t.radius
      }))
    };
    const code = await createRoomWithRetry(d.projectId, roomData, 3);
    AppState.gmCreatedCode = code;
    await idbPut('gmRoom', Object.assign({ id:'current', roomCode: code, projectId: d.projectId }, roomData));
    AppState.loading = false;
    setScreen('gmCreated');
  } catch(e){
    AppState.loading = false;
    render();
    toast('部屋の作成に失敗しました: ' + e.message, 'error');
  }
}

/* =========================================================================
   探索ゲーム本体（自由選択制）
   ========================================================================= */
function startExploreRuntime(){
  AppState.screen = 'explore';
  startGpsWatch();
  stopTimer();
  AppState.timerHandle = setInterval(onTimerTick, 1000);
  render();
}
function startGpsWatch(){
  if (!navigator.geolocation) return;
  if (AppState.gpsWatchId != null) return; // 起動時1回のみ許可
  AppState.gpsWatchId = navigator.geolocation.watchPosition(
    (pos) => { AppState.currentPosition = pos.coords; },
    (err) => { console.warn('GPS error', err); },
    { enableHighAccuracy:true, maximumAge:2000, timeout:15000 }
  );
}
function stopGpsWatch(){
  if (AppState.gpsWatchId != null && navigator.geolocation){
    navigator.geolocation.clearWatch(AppState.gpsWatchId);
  }
  AppState.gpsWatchId = null;
}
function stopTimer(){
  if (AppState.timerHandle){ clearInterval(AppState.timerHandle); AppState.timerHandle = null; }
}
function onTimerTick(){
  const s = AppState.session;
  if (!s) return;
  s.remainingSec = Math.max(0, s.remainingSec - 1);
  s.updatedAt = Date.now();
  saveSessionToIdb();
  if (s.remainingSec <= 0){
    endGame();
    return;
  }
  render();
}
function saveSessionToIdb(){
  if (!AppState.session) return;
  idbPut('playerSession', AppState.session).catch(()=>{});
}
function statusIcon(state){
  if (state.status === 'cleared') return '✅';
  if (state.status === 'skipped') return '⏭️';
  if (state.currentLv > 1 || state.wrongCount > 0) return '🔵';
  return '⬜';
}
function statusLabel(state){
  if (state.status === 'cleared') return 'クリア';
  if (state.status === 'skipped') return 'スキップ';
  if (state.currentLv > 1 || state.wrongCount > 0) return '挑戦中';
  return '未着手';
}
function renderExplore(){
  const s = AppState.session;
  if (!s) return renderTitle();
  const clearedCount = Object.values(s.targetStates).filter(x => x.status==='cleared' || x.status==='skipped').length;

  const gridHtml = s.targets.map(t => {
    const state = s.targetStates[t.id];
    const selected = s.selectedTargetId === t.id;
    const border = selected ? 'border-sage ring-2 ring-sage' : 'border-stone-300';
    const doneStyle = (state.status==='cleared') ? 'opacity-70' : (state.status==='skipped' ? 'opacity-50' : '');
    return `
    <button onclick="selectTarget('${t.id}')" class="bg-white border ${border} ${doneStyle} rounded-xl p-3 text-left shadow-sm">
      <div class="flex items-center justify-between mb-1">
        <span class="text-lg">${statusIcon(state)}</span>
        <span class="text-[10px] font-bold text-stone-400">${statusLabel(state)}</span>
      </div>
      <div class="text-sm font-bold truncate">${escHtml(t.name)}</div>
      ${state.status==='cleared' ? `<div class="text-xs text-sage font-bold mt-0.5">+${s.__lastEarned && s.__lastEarned[t.id] != null ? s.__lastEarned[t.id] : ''}pt</div>` : ''}
    </button>`;
  }).join('');

  const detailHtml = s.selectedTargetId ? renderTargetDetail(s.targets.find(t=>t.id===s.selectedTargetId), s.targetStates[s.selectedTargetId]) : '';

  return `
  <div class="max-w-md mx-auto px-4 pt-4">
    <div class="flex items-center justify-between mb-4">
      <div>
        <div class="text-[11px] text-stone-500 font-bold">残り時間</div>
        <div class="text-2xl font-black ${s.remainingSec<=60?'text-terracotta':''}">${fmtTime(s.remainingSec)}</div>
      </div>
      <div class="text-right">
        <div class="text-[11px] text-stone-500 font-bold">合計スコア</div>
        <div class="text-2xl font-black text-sage">${s.totalScore} pt</div>
      </div>
      <button onclick="confirmEndGame()" class="text-xs text-stone-400 border border-stone-300 rounded-lg px-2 py-1 ml-2">✕ 中断</button>
    </div>

    <div class="text-xs text-stone-500 mb-2">進捗: ${clearedCount} / ${s.targets.length}</div>

    ${detailHtml}

    <div class="grid grid-cols-2 gap-3 mt-2 mb-8">${gridHtml}</div>
  </div>`;
}

function renderTargetDetail(t, state){
  if (!t) return '';
  const lv = state.currentLv;
  const levelDef = HINT_LEVELS[lv];
  const photo = t.hints ? t.hints[lv] : null;
  const now = Date.now();
  const cooling = AppState.cooldownUntil > now;
  const coolLeft = cooling ? Math.ceil((AppState.cooldownUntil - now)/1000) : 0;
  const finished = state.status === 'cleared' || state.status === 'skipped';
  const feedback = AppState.judgeFeedback;

  return `
  <div id="target_detail_panel" class="bg-white border border-stone-300 rounded-2xl p-4 shadow-sm mb-4 ${feedback&&feedback.targetId===t.id ? (feedback.ok?'tc-flash-ok':'tc-flash-ng') : ''}">
    <div class="flex items-center justify-between mb-2">
      <div class="font-bold">${escHtml(t.name)}</div>
      <button onclick="deselectTarget()" class="text-stone-400 text-sm">閉じる ✕</button>
    </div>

    <div class="aspect-[9/16] w-full max-w-[220px] mx-auto bg-stone-100 rounded-xl overflow-hidden border border-stone-300 mb-3">
      ${photo ? `<img src="${photo}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-stone-400 text-sm p-4 text-center">この段階の画像は<br>登録されていません</div>`}
    </div>

    <div class="text-center mb-3">
      <span class="inline-block bg-cream border border-stone-300 rounded-full px-3 py-1 text-xs font-bold">
        Lv${lv} ${levelDef.label} ・ 獲得可能 ${state.currentPoints} pt
      </span>
    </div>

    ${feedback && feedback.targetId===t.id ? `<div class="text-center text-sm font-bold mb-3 ${feedback.ok?'text-sage':'text-terracotta'}">${escHtml(feedback.text)}</div>` : ''}

    ${finished ? `
      <div class="text-center text-sm font-bold text-stone-500 py-2">
        ${state.status==='cleared' ? `クリア済み（獲得 ${state.earned||0} pt）` : 'スキップ済み'}
      </div>
    ` : `
      <div class="flex gap-2 mb-2">
        <button onclick="judgeCurrentTarget()" ${cooling?'disabled':''} class="flex-1 bg-sage active:bg-sage-dark text-white font-black rounded-xl py-3 disabled:opacity-50">
          ${cooling ? `⏳ ${coolLeft}秒` : '📍 現在地判定'}
        </button>
        <button onclick="revealNextHint()" ${lv>=5?'disabled':''} class="flex-1 bg-stone-800 text-white font-bold rounded-xl py-3 disabled:opacity-30">
          次のヒント
        </button>
      </div>
      <button onclick="skipTarget()" class="w-full bg-white border border-terracotta text-terracotta font-bold rounded-xl py-2.5">このお題をスキップ</button>
    `}
  </div>`;
}

function selectTarget(id){
  AppState.session.selectedTargetId = id;
  AppState.judgeFeedback = null;
  saveSessionToIdb();
  render();
}
function deselectTarget(){
  AppState.session.selectedTargetId = null;
  AppState.judgeFeedback = null;
  render();
}
function revealNextHint(){
  const s = AppState.session;
  const state = s.targetStates[s.selectedTargetId];
  if (!state || state.status !== 'untouched' || state.currentLv >= 5) return;
  state.currentLv += 1;
  state.currentPoints = HINT_LEVELS[state.currentLv].points;
  AppState.judgeFeedback = null;
  saveSessionToIdb();
  render();
}
function skipTarget(){
  if (!confirm('このお題をスキップしますか？（ポイントは獲得できません）')) return;
  const s = AppState.session;
  const state = s.targetStates[s.selectedTargetId];
  if (!state) return;
  state.status = 'skipped';
  AppState.judgeFeedback = null;
  saveSessionToIdb();
  render();
}
function judgeCurrentTarget(){
  const now = Date.now();
  if (AppState.cooldownUntil > now) return;
  const s = AppState.session;
  const t = s.targets.find(x => x.id === s.selectedTargetId);
  const state = s.targetStates[s.selectedTargetId];
  if (!t || !state || state.status !== 'untouched') return;

  AppState.cooldownUntil = now + COOLDOWN_MS;

  const pos = AppState.currentPosition;
  if (!pos){
    AppState.judgeFeedback = { targetId:t.id, ok:false, text:'GPS取得中です。少し待ってから再度お試しください。' };
    render();
    scheduleCooldownRerender();
    return;
  }
  const radius = t.radius != null ? t.radius : s.defaultRadius;
  const d = distMeters(pos.latitude, pos.longitude, t.lat, t.lng);

  if (d <= radius){
    state.status = 'cleared';
    state.earned = state.currentPoints;
    s.totalScore += state.currentPoints;
    s.__lastEarned = s.__lastEarned || {};
    s.__lastEarned[t.id] = state.earned;
    AppState.judgeFeedback = { targetId:t.id, ok:true, text:`正解！ +${state.earned} pt` };
  } else {
    state.wrongCount += 1;
    const floor = HINT_LEVELS[state.currentLv].floor;
    state.currentPoints = Math.max(floor, state.currentPoints - 1);
    const hint = d < 300 ? `（目安距離 約${Math.round(d/10)*10}m）` : '';
    AppState.judgeFeedback = { targetId:t.id, ok:false, text:`圏外です… ${hint}` };
  }
  saveSessionToIdb();
  render();
  scheduleCooldownRerender();
}
function scheduleCooldownRerender(){
  const target = AppState.cooldownUntil;
  setTimeout(() => {
    if (AppState.cooldownUntil === target) render();
  }, COOLDOWN_MS + 50);
}
function confirmEndGame(){
  if (!confirm('探索を中断してタイトルへ戻ります。よろしいですか？')) return;
  endGame();
}
async function endGame(){
  stopTimer();
  stopGpsWatch();
  const s = AppState.session;
  AppState.lastResult = s;
  try { await idbDelete('playerSession', 'current'); } catch(e){}
  setScreen('result');
}

  const s = AppState.lastResult;
  if (!s) return renderTitle();
  const rows = s.targets.map(t => {
    const state = s.targetStates[t.id];
    const pts = state.status==='cleared' ? (state.earned||0) : 0;
    return `
    <div class="flex items-center justify-between border-b border-stone-200 py-2 text-sm">
      <div class="flex items-center gap-2">
        <span>${statusIcon(state)}</span>
        <span class="font-medium">${escHtml(t.name)}</span>
      </div>
      <span class="font-bold ${pts>0?'text-sage':'text-stone-400'}">${pts>0?'+':''}${pts} pt</span>
    </div>`;
  }).join('');

  return `
  <div class="max-w-md mx-auto px-5 pt-10">
    <div class="text-center mb-6">
      <div class="text-4xl mb-2">🏁</div>
      <h1 class="text-lg font-bold">探索終了</h1>
    </div>
    <div class="bg-white border border-stone-300 rounded-2xl p-6 shadow-sm text-center mb-5">
      <p class="text-xs text-stone-500 mb-1">合計スコア</p>
      <p class="text-5xl font-black text-sage">${s.totalScore}<span class="text-lg ml-1">pt</span></p>
    </div>
    <div class="bg-white border border-stone-300 rounded-2xl p-4 shadow-sm mb-8">${rows}</div>
    <button onclick="backToTitleFromResult()" class="w-full bg-stone-800 text-white font-bold rounded-xl py-3">タイトルへ戻る</button>
  </div>`;
}
function backToTitleFromResult(){
  AppState.session = null;
  AppState.lastResult = null;
  AppState.playerJoin = { projectId: localStorage.getItem(LS_KEY_PROJECT_ID) || '', code:'' };
  setScreen('title');
}

/* =========================================================================
   初期化
   ========================================================================= */
async function init(){
  const params = new URLSearchParams(location.search);
  AppState.urlRoomCode = (params.get('room') || '').replace(/[^0-9]/g,'').slice(0,4);
  AppState.urlProjectId = params.get('pid') || '';

  await checkResumeOnLoad();

  if (!AppState.resumeAvailable && AppState.urlRoomCode){
    goPlayerJoin();
    return;
  }
  render();
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
